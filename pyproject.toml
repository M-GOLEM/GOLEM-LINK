[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "golem-link"
version = "1.8.1"
description = "GOLEM LINK - unified dual-computer workstation and distributed computing platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psutil>=5.9",
    "zeroconf>=0.131",
    "pydantic>=2.6",
    "cryptography>=42.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
golem-link = "golem_link.cli:main"

[tool.setuptools.packages.find]
include = ["golem_link*"]

[tool.setuptools.package-data]
golem_link = ["web/index.html", "web/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
